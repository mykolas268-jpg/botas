name: daily digest

# Runs the digest without a server. GitHub cron is UTC-only and can start late, so it
# fires three times around 08:00 Europe/Vilnius (05:03/06:03/07:03 UTC covers both summer
# and winter time); run_once.py posts on the first run at/after 08:00 local and skips the rest.
# If you change DIGEST_HOUR or TIMEZONE, adjust these UTC hours too.
on:
  schedule:
    - cron: "3 5,6,7 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Post right now (ignore time and once-per-day checks)"
        type: boolean
        default: true

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: discord-digest-bot
    env:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
      DB_PATH: state/digest.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: discord-digest-bot/requirements.txt
      - run: pip install -r requirements.txt

      # SQLite state (posted URLs, last post date) survives between runs via the Actions cache.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: discord-digest-bot/state
          key: digest-state-${{ github.run_id }}
          restore-keys: digest-state-
      - run: mkdir -p state

      - name: Post digest
        run: python run_once.py ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: discord-digest-bot/state
          key: digest-state-${{ github.run_id }}
